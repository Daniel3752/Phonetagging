name = "telnyx-callfork"
main = "src/index.js"
compatibility_date = "2025-01-01"

# No KV, no D1, no Durable Objects — on purpose. Durable Objects require the
# Workers paid plan ($5/mo), which is 5x this project's entire budget. Telnyx's
# call queue holds the only state this system has. Free tier is the target.

# ---------------------------------------------------------------------------
# IDENTITY VALUES ARE SECRETS — DO NOT PUT THEM IN THIS FILE.
#
# This repository is public. Anything written into [vars] below is published to
# the internet permanently (git keeps history, so deleting it later does not
# un-publish it). Your phone numbers and SIP endpoint are personal data, and an
# exposed SIP URI is a standing target for toll-fraud scanners.
#
# Set them as secrets instead — the Worker reads secrets and vars identically,
# so no code changes:
#
#   npx wrangler secret put TELNYX_US_DID      # +1XXXXXXXXXX — inbound DID, callback
#                                              # target, and callerId on every
#                                              # outbound leg (Israeli carriers
#                                              # reject CLI you don't own)
#   npx wrangler secret put SIP_URI            # sip:credential@sip.telnyx.com —
#                                              # $0 termination, the leg we WANT
#                                              # answered
#   npx wrangler secret put FLIP_NUMBER        # +9725XXXXXXX — rings free, costs
#                                              # $0.1096/min 60/60 if it ANSWERS
#   npx wrangler secret put IPHONE_HOT_NUMBER  # +9725XXXXXXX
#
# FLIP_NUMBER and IPHONE_HOT_NUMBER are also the callback whitelist: only those
# two numbers may dequeue a parked caller.
#
# For local `wrangler dev`, put the same keys in .dev.vars (gitignored).
# See .dev.vars.example.
# ---------------------------------------------------------------------------

[vars]
# Non-sensitive tuning only. Safe to commit.
RING_TIMEOUT = "15"        # seconds the fork rings (Telnyx clamps to 5-120)
MAX_HOLD_SECONDS = "60"    # max park time before the voicemail prompt
QUEUE_NAME = "parked"      # single fixed queue — the entire state model

# Optional hold music (MP3/WAV URL). Empty -> a short spoken hold line instead.
HOLD_MUSIC_URL = ""

# Optional prompt overrides.
# GREETING_TEXT = "One moment please, connecting you."
# HOLD_TEXT = "Please hold, connecting you now."
# VOICEMAIL_TEXT = "Sorry, no one is available right now. Please try again later. Goodbye."
# NO_CALL_WAITING_TEXT = "There is no call waiting. Goodbye."
# VOICE = "female"
# LANGUAGE = "en-US"

# Force the absolute base URL used in TeXML action/waitUrl attributes. Leave
# unset to derive it from the incoming request origin.
# PUBLIC_BASE_URL = "https://telnyx-callfork.example.workers.dev"

# Set to "false" in production once the XML has been verified, to disable ?dry=1.
ALLOW_DRY_RUN = "true"

# Remaining secret, in addition to the four identity values above:
#   npx wrangler secret put TELNYX_PUBLIC_KEY
#     Telnyx portal > Account Settings > Keys & Credentials > Public Key.
#     Enables Ed25519 webhook signature verification. If unset, the worker
#     fails open, but the dequeue path is still gated by the ANI whitelist.
