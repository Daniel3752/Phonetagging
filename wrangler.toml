name = "phone-url-filter"
main = "src/index.js"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "phone-url-filter-db"
database_id = "9e5b0576-7a7c-4af0-8d13-495fb9e30718"

# The scheduler flips each device onto the policy its time windows call for. Every 5 minutes is a
# balance: fine enough that a window boundary lands roughly on time, coarse enough to stay well
# inside the free tier. A run with nothing to change makes no API calls at all.
[triggers]
crons = ["*/5 * * * *"]

[vars]
CF_ACCOUNT_ID = "905456397f790c63aafc1cb42c400cb3"

# The DOMAIN-type Gateway list the default-deny DNS policy allowlists against. This is what v1
# enforces. Created by scripts/setup-gateway.sh, which prints the id to paste here.
CF_GATEWAY_HOST_LIST_ID = "128c36f6-5345-4361-887e-998f1eeb6365"

# The URL-type list read by the (currently unused) default-deny HTTP policy. Dormant in v1 and kept
# for the path-blocking upgrade path — see the "Forward-compatibility" section of the plan.
CF_GATEWAY_LIST_ID = "ca654a6f-6899-48d6-afa7-51e187a37451"

# Secrets — set via wrangler secret put (values are NOT stored here):
#   npx wrangler secret put GEMINI_API_KEY        (Google Gemini key — site classification)
#   npx wrangler secret put CF_GATEWAY_API_TOKEN  (Cloudflare token, Account > Zero Trust > Edit)
#   npx wrangler secret put OPERATOR_KEY          (bearer token gating /api/admin/*)
#   npx wrangler secret put HEADWIND_API_TOKEN    (or HEADWIND_USER + HEADWIND_PASSWORD)
#
# The self-hosted Headwind MDM server the scheduler drives.
HEADWIND_BASE_URL = "https://mdm.getshmira.com"
