# Squid — the filtering proxy. Read PROXY.md first.
#
# This file describes the LIVE server (mdm.getshmira.com) as of 2026-09-03. It is installed verbatim
# by install-squid.sh, which OVERWRITES /etc/squid/squid.conf — so anything changed on the server
# by hand must be brought back here, or the next install silently reverts it.
#
# Two ways a phone reaches this proxy:
#
#   * WireGuard (the current model). The phone's whole connection is routed through wg0 and
#     iptables redirects ports 80/443 into the intercept ports below. No proxy setting on the phone,
#     no password prompt; the phone's tunnel address (10.66.0.x) is its identity, and it must equal
#     devices.proxy_user in D1. Nothing on the phone needs a login.
#   * Explicit proxy with a password (the original model, port 3128). Kept for phones set up that
#     way; the htpasswd login is the identity.
#
# Both feed the same helper, which asks the Worker once per request.

# --- Ports ----------------------------------------------------------------------------------------

# Explicit proxy, for phones with `http_proxy` set and a password.
http_port 3128 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=8MB \
  tls-cert=/etc/squid/ssl/filter-ca.crt \
  tls-key=/etc/squid/ssl/filter-ca.key \
  cipher=HIGH:MEDIUM:!LOW:!RC4:!SEED:!IDEA:!3DES:!MD5:!EXP:!PSK:!DSS \
  options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 8MB

# Transparent intercept for WireGuard phones. iptables (nat, PREROUTING on wg0) sends
# 80 -> 3129 and 443 -> 3130.
http_port 3129 intercept
https_port 3130 intercept ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=8MB \
  tls-cert=/etc/squid/ssl/filter-ca.crt \
  tls-key=/etc/squid/ssl/filter-ca.key \
  cipher=HIGH:MEDIUM:!LOW:!RC4:!SEED:!IDEA:!3DES:!MD5:!EXP:!PSK:!DSS \
  options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1

acl wg_phones src 10.66.0.0/24

# Squid resolves on the phones' behalf. Intercept mode verifies that the hostname a client asked for
# resolves to the address it actually connected to; when the phone's resolver and this one disagree
# (CDNs with many addresses) Squid logs "Host header forgery" and refuses. Pushing this server's
# resolver to the phones over WireGuard (DNS = 10.66.0.1) keeps the two in step.
dns_nameservers 127.0.0.1 1.1.1.1

# --- Who may connect ------------------------------------------------------------------------------

# Non-interactive Android/Google system traffic (account sign-in, Play, push) cannot answer an auth
# prompt and pins its certificates, so it is exempt from BOTH auth (here) and interception
# (splice.txt). Deliberately does NOT include www.google.com — that is the search front door.
acl google_system_hosts dstdomain .googleapis.com ssl.gstatic.com www.gstatic.com fonts.gstatic.com connectivitycheck.gstatic.com accounts.google.com android.clients.google.com play.google.com google-ohttp-relay-safebrowsing.fastly-edge.com .gvt1.com .gvt2.com dl.google.com .ggpht.com .android.com .googleusercontent.com .whatsapp.net .whatsapp.com
acl web_ports port 80 443
http_access allow google_system_hosts web_ports

# The Headwind agent is a background service: exempt its host or the phone goes unmanageable the
# moment the proxy is on.
acl mdm_host dstdomain mdm.getshmira.com
http_access allow mdm_host web_ports

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 8
auth_param basic realm Filtered internet
auth_param basic credentialsttl 24 hours
auth_param basic casesensitive on

# WireGuard phones are identified by address and never prompted; everyone else needs a login.
acl authenticated proxy_auth REQUIRED
http_access deny !wg_phones !authenticated

# The tunnel must open before anything inside it can be seen. Whether it is then decrypted or
# passed through is decided below, per hostname, by ssl_bump — not here.
acl CONNECT method CONNECT
http_access allow CONNECT

# --- The filter itself ----------------------------------------------------------------------------

# Asked once per request (and once per hostname at the handshake, above). ttl=0 because the Worker's
# answer is already cached in D1 and in the helper's short local cache.
#
# %LOGIN is the htpasswd login for explicit-proxy phones and "-" for intercepted ones; the helper
# falls back to %SRC (the WireGuard address) when there is no login. Both are looked up in
# devices.proxy_user.
external_acl_type shmira_filter \
  ttl=0 negative_ttl=0 \
  concurrency=32 children-max=8 children-startup=2 \
  %LOGIN %SRC %URI \
  /usr/local/bin/squid-acl-helper.py

acl filter_allows external shmira_filter

# --- Decrypt or pass through: decided per hostname -------------------------------------------------
#
# The fact that shapes all of this: on Android 7+, APPS DO NOT TRUST A USER-INSTALLED CERTIFICATE.
# Only browsers do. So decrypting a connection is only useful when a browser made it, and breaks any
# app that made it. Squid cannot see which app opened a connection — only the hostname it asked for.
#
# So the rule is: ask the filter about the HOSTNAME, at the handshake, before deciding.
#
#   approved for this phone's rung  -> SPLICE: tunnel untouched. Apps work, no certificate needed.
#   denied                          -> BUMP: decrypt, so Chrome can be redirected to the block page
#                                      (an app just fails, which is a block either way).
#   a search engine                 -> always BUMP: the typed query lives in the URL, and judging it
#                                      is the whole point of running a proxy instead of DNS.
#   the explicit blocklist          -> always BUMP, so the block page can explain itself.
#
# What this gives up: on an approved site, Chrome is filtered by hostname, not by full path, and the
# rung-2 image stripping cannot see inside the tunnel. That is the same granularity as the earlier
# DNS design and the README already treats path filtering as deferred. What it removes: the need to
# list every app anyone will ever use in splice.txt. That list is now only for hosts that must
# never even be JUDGED (Google account/Play infrastructure, WhatsApp, the MDM server).

acl splice_hosts ssl::server_name "/etc/squid/splice.txt"
acl bump_hosts ssl::server_name www.google.com .bing.com duckduckgo.com search.yahoo.com search.brave.com encrypted-tbn0.gstatic.com encrypted-tbn1.gstatic.com encrypted-tbn2.gstatic.com encrypted-tbn3.gstatic.com
acl l1_hosts ssl::server_name "/etc/squid/blocklists/level1.domains"

acl step1 at_step SslBump1

# Peek first so the hostname is known (it arrives in the TLS ClientHello). Every later rule is
# evaluated at step 2 with that hostname in hand.
ssl_bump peek step1
ssl_bump bump bump_hosts
ssl_bump bump l1_hosts
ssl_bump splice splice_hosts
# The filter's answer for "host:443" — the same helper, the same Worker, the same rung. The helper
# already turns a bare host:port into https://host/ for the site check.
ssl_bump splice filter_allows
ssl_bump bump all

# --- Filtering the requests themselves ---------------------------------------------------------

# The Worker's own host must always be reachable, or the block page cannot load.
acl worker_host dstdomain .workers.dev
http_access allow worker_host

# Everyone here is either a WireGuard phone or authenticated, so this rule carries no auth ACL —
# which is what makes a denial a deny_info redirect rather than a 407 the phone can never satisfy.
http_access deny !filter_allows
http_access allow all

# --- Denials --------------------------------------------------------------------------------------

# Keyed to filter_allows, the ACL that causes the denial. %s is the denied URL, which the block page
# reads to tell a refused search from an unreviewed site.
deny_info https://phone-url-filter.daniel08-madar.workers.dev/blocked?url=%s filter_allows

# --- Privacy --------------------------------------------------------------------------------------

# This proxy sees every address every phone visits. The access log is OFF. Turn it on to debug
# (sed the line, `squid -k reconfigure`), and off again after.
access_log none
cache_store_log none
cache deny all
via off
forwarded_for delete
httpd_suppress_version_string on

cache_mem 64 MB
maximum_object_size_in_memory 128 KB
pid_filename /var/run/squid.pid
