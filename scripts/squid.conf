# Squid configuration for the filtering proxy.
#
# Install with scripts/install-squid.sh, which fills in the paths and generates the CA.
#
# The shape of this file is decided by one constraint: apps do not trust a certificate you installed
# yourself. Chrome does; almost nothing else does. So traffic is split in two — anything you want to
# READ is decrypted (bumped), and anything that merely needs to WORK is passed through untouched
# (spliced). The splice list is not a filtering decision, it is a "do not break this app" decision.

# --- Ports ---------------------------------------------------------------------------------------

# 3128 is the conventional Squid port. Move this to 443 once the setup is proven: networks routinely
# block unusual ports, and a filter that stops working on a hotel's wifi is a filter people remove.
http_port 3128 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=8MB \
  tls-cert=/etc/squid/ssl/filter-ca.crt \
  tls-key=/etc/squid/ssl/filter-ca.key \
  cipher=HIGH:MEDIUM:!LOW:!RC4:!SEED:!IDEA:!3DES:!MD5:!EXP:!PSK:!DSS \
  options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 8MB

# --- WireGuard path (transparent interception) ---------------------------------------------------

# Phones on the WireGuard tunnel don't set a proxy at all: install-wireguard.sh redirects their
# tcp/80 and tcp/443 into these two ports with iptables. Identity is the tunnel IP (one address per
# peer, handed out by new-wg-phone.sh and stored as the device's proxy_user), so there is no login,
# no password, and no per-reboot credential prompt. The 3128 password path above keeps working —
# both run side by side while the fleet migrates.
http_port 3129 intercept
https_port 3130 intercept ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=8MB \
  tls-cert=/etc/squid/ssl/filter-ca.crt \
  tls-key=/etc/squid/ssl/filter-ca.key \
  cipher=HIGH:MEDIUM:!LOW:!RC4:!SEED:!IDEA:!3DES:!MD5:!EXP:!PSK:!DSS \
  options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1

# The tunnel subnet. Must match WG_SUBNET in install-wireguard.sh.
acl wg_phones src 10.66.0.0/24

# Resolve through the same dnsmasq the phones use (installed by install-wireguard.sh), so the
# host-forgery check in intercept mode compares like with like — phone and Squid draw from one
# cache and always agree on a host's IP. 1.1.1.1 is the failover if dnsmasq is down; while on the
# failover, Google-app 409s may return until dnsmasq is back.
dns_nameservers 127.0.0.1 1.1.1.1

# --- Who is who ----------------------------------------------------------------------------------

# Every phone gets its own proxy login. That login is the device's identity, and it is what makes
# per-person strictness possible at all — the Worker maps it to a device row and its level.
#
# This is the part the DNS architecture could never do: DNS-over-TLS carries no identity, so telling
# one phone from another needed a separate Cloudflare DNS location per device. A proxy login gives it
# away for free.
# Non-interactive Android/Google system traffic (account sign-in, Play Services push
# signaling, Play Store) cannot answer an HTTP proxy auth challenge -- there is no UI surface for
# it outside a browser, so it gets a bare 407 forever and account setup / Play Store simply never
# works. These are API and account infrastructure, not user-browsable content, so the same
# tradeoff as a Do-Not-Inspect list applies: skip auth AND filtering for them.
#
# Deliberately does NOT include www.google.com -- that is also the search front door, and search
# must stay authenticated and filtered. It also must be listed in splice.txt (below), not just
# here: this ACL only decides whether the request needs a login, not whether ssl_bump intercepts
# it, and several of these (signaler-pa.googleapis.com in particular) pin their certificate, so a
# bumped connection to them fails even once auth is no longer the blocker.
#
# gstatic is listed by SUBDOMAIN, not as .gstatic.com wholesale: encrypted-tbn*.gstatic.com is
# where Google search/image-search result THUMBNAILS live, and a blanket exemption put every
# thumbnail outside the filter — which also made the helper's images-off thumbnail suppression
# dead code for Google. The subdomains named here are the ones account sign-in, Play and the
# connectivity probe actually need. If a Google sign-in step breaks after this change, the fix is
# adding the one subdomain cache.log names — not restoring .gstatic.com.
acl google_system_hosts dstdomain .googleapis.com ssl.gstatic.com www.gstatic.com fonts.gstatic.com connectivitycheck.gstatic.com accounts.google.com android.clients.google.com play.google.com google-ohttp-relay-safebrowsing.fastly-edge.com .gvt1.com .gvt2.com dl.google.com .ggpht.com .android.com .googleusercontent.com .whatsapp.net .whatsapp.com

# These pre-auth exemptions would otherwise make the box an open relay to the listed hosts for
# anyone on the internet (3128 is world-reachable; phones roam, so it cannot be IP-restricted).
# Constraining them to web ports bounds the abuse to boring HTTP relaying of hosts we exempt anyway.
acl web_ports port 80 443
http_access allow google_system_hosts web_ports

# The Headwind MDM agent is a background service and, like Play Services, cannot answer an
# interactive proxy auth prompt. Once the system proxy is set it can no longer reach its own
# server to sync config or apps -- the device silently goes offline. Exempt the MDM host from
# auth (here) and from interception (splice.txt), or the whole management channel dies the
# moment filtering is turned on. Set to your Headwind host.
acl mdm_host dstdomain mdm.getshmira.com
http_access allow mdm_host web_ports

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 8
auth_param basic realm Filtered internet
auth_param basic credentialsttl 24 hours
auth_param basic casesensitive on

acl authenticated proxy_auth REQUIRED
# WireGuard phones are identified by tunnel IP, not credentials — auth cannot even be asked on an
# intercepted connection (there is no proxy in the client's eyes to answer a 407). Everyone else
# must still log in. Squid ANDs the terms: this denies only clients that are neither on the tunnel
# nor authenticated.
http_access deny !wg_phones !authenticated

# The tunnel must open before anything inside it can be seen, so allow the CONNECT itself once the
# user is authenticated. The URL filter runs on the DECRYPTED requests after ssl-bump, never on the
# opaque CONNECT envelope: at CONNECT time the only thing visible is "host:443", and filtering there
# would turn every block into a 407 the phone can never satisfy with credentials. For a bumped host
# the inner GET is still filtered (and a block page shown over our own certificate); for a spliced
# host the tunnel is passed through untouched, which is the point of splicing.
acl CONNECT method CONNECT
http_access allow CONNECT

# --- The filter itself ---------------------------------------------------------------------------
#
# Defined BEFORE the interception section below, which uses it: Squid needs an ACL declared ahead
# of its first use, and `ssl_bump splice filter_allows` refers to it.

# Asked once per request. ttl=0 because the Worker's own answer is already cached — both in D1 and in
# the helper's short-lived local cache — and a second layer of caching here would only make an
# operator's decision take longer to reach the phones.
#
# concurrency lets one helper process handle many requests in flight, which matters because a single
# page load fans out into dozens of them.
# %LOGIN carries the password path's identity, %SRC the WireGuard path's (the tunnel IP). The
# helper uses %LOGIN when present and falls back to %SRC — the Worker looks either one up in the
# same devices.proxy_user column, so a WG phone's row simply stores its tunnel IP there.
# concurrency/children: how many lookups can be in flight. queue-size: how many more may WAIT
# before squid gives up on them — and a lookup squid gives up on is a DENY. Every TLS handshake is
# now a lookup, and a never-seen host holds one for several seconds while the Worker judges it, so
# a fresh phone's first page load can have a hundred outstanding at once. The default queue (twice
# children-max = 16) overflowed and denied everything on the first live phone.
external_acl_type shmira_filter \
  ttl=0 negative_ttl=0 \
  concurrency=64 children-max=8 children-startup=2 queue-size=1024 \
  %LOGIN %SRC %URI \
  /usr/local/bin/squid-acl-helper.py

acl filter_allows external shmira_filter

# --- What gets read, and what gets left alone ----------------------------------------------------

# Hosts here are tunnelled blind: Squid never presents its own certificate, so the app sees the real
# one and keeps working. Add an entry whenever an app breaks under interception — that is the whole
# maintenance burden of this architecture, and it is bounded by how many apps you permit.
#
# A spliced host is COMPLETELY unfiltered. If you do not trust an app, do not splice it — block it at
# the app level instead.
acl splice_hosts ssl::server_name "/etc/squid/splice.txt"

# The only traffic whose CONTENT the filter needs to read is search — the typed query lives in the
# URL, so search engines must be decrypted. Result thumbnails (encrypted-tbn*) are included so the
# images-off stripping can see them.
acl bump_hosts ssl::server_name www.google.com .bing.com duckduckgo.com search.yahoo.com search.brave.com encrypted-tbn0.gstatic.com encrypted-tbn1.gstatic.com encrypted-tbn2.gstatic.com encrypted-tbn3.gstatic.com

# Known-explicit hosts (flattened from level1.json by sync-blocklists.sh). On the tunnel path they
# are bumped ON PURPOSE, only so the denial can be a proper block page instead of a raw connection
# error — the helper then denies the decrypted request via its own L1 check. The file always exists
# (the sync guarantees it), because squid refuses to start on a missing ACL file.
acl l1_hosts ssl::server_name "/etc/squid/blocklists/level1.domains"

# The Worker's own host serves the block page. Splice it: judging it would be circular, and a
# spliced connection shows the real certificate.
acl worker_sni ssl::server_name .workers.dev

acl step1 at_step SslBump1

# Peek at the handshake so the destination hostname is known, then decide — per hostname, by
# asking the filter.
#
# The fact that shapes this: on Android 7+, APPS DO NOT TRUST A USER-INSTALLED CERTIFICATE. Only
# browsers do. So decrypting a connection only helps when a browser made it, and breaks any app that
# made it — and Squid cannot see which app opened a connection, only the hostname it asked for.
#
#   approved for this phone's rung  -> SPLICE: tunnel untouched. Apps work, nothing needs a cert.
#   denied                          -> BUMP: decrypt, so Chrome is redirected to the block page
#                                      (an app just fails, which is a block either way).
#   a search engine (bump_hosts)    -> always BUMP: the typed query lives in the URL.
#   the explicit list (l1_hosts)    -> always BUMP, so the block page can explain itself.
#   splice.txt                      -> SPLICE, never judged: Google account/Play infrastructure,
#                                      WhatsApp, the MDM host.
#
# The earlier `ssl_bump splice wg_phones` (splice-by-default for tunnel phones) made every app work
# and filtered nothing: `http_access allow CONNECT` above admits the tunnel before the filter is
# consulted, so a spliced host was never judged at all — Instagram and TikTok loaded through it on
# the first live phone. Asking the filter HERE, at the handshake, is what gives spliced connections
# a hostname check. The helper already turns the handshake's "host:443" into https://host/.
#
# What is given up on an approved site: path-level filtering and rung-2 image stripping (Chrome is
# filtered by hostname there). What is removed: the per-app splice treadmill.
#
# peek FIRST: at step 1 the SNI is not yet known, so the hostname ACLs below can only match after
# the peek.
ssl_bump peek step1
ssl_bump bump bump_hosts
ssl_bump bump l1_hosts
ssl_bump splice splice_hosts
ssl_bump splice worker_sni
ssl_bump splice filter_allows
ssl_bump bump all

# Three things are enforced OUTSIDE this file, deliberately, and are noted here so their absence is
# not mistaken for an omission:
#   * Explicit/social BLOCKLISTS and per-rung IMAGE stripping are decided per request by the helper
#     and the Worker (the helper checks the explicit list before even calling the Worker; the Worker
#     returns a deny for an image request on the text-only rung). Nothing to configure here.
#   * Forced SAFESEARCH is a DNS concern, not a proxy one: map the search engines to their SafeSearch
#     VIPs (forcesafesearch.google.com, strict.bing.com) via the phone's locked Private DNS. It is a
#     post-enrolment device task (see BUILD-PLAN.md §6/§10), not a squid.conf rule.

# The Worker's own host must always resolve, or the block page cannot load and nobody can ever
# request a site — the system would have no way to unblock itself.
acl worker_host dstdomain .workers.dev
http_access allow worker_host

# Everyone reaching this point is already authenticated (the deny above removed the rest). So the
# only remaining decision is the filter's, and the denying rule contains NO auth ACL — which is what
# makes Squid return the deny_info block page on a block, rather than mistaking it for an auth
# challenge and looping the phone on a 407 that credentials can never satisfy.
http_access deny !filter_allows
http_access allow all

# --- Denials -------------------------------------------------------------------------------------

# deny_info is keyed by the ACL that caused the denial, so this must name filter_allows — the ACL in
# `http_access deny !filter_allows`. Keyed to `all` it never fires, and a blocked phone gets a bare
# 403 with no way to request the site: the system loses its only route to unblocking itself.
#
# %s is the denied URL, which the page reads to tell an unreviewed site from a refused search.
deny_info https://phone-url-filter.daniel08-madar.workers.dev/blocked?url=%s filter_allows

# --- Privacy -------------------------------------------------------------------------------------

# This proxy sees every address every phone visits. Logging all of it creates a permanent record of
# people's browsing on a box that is not hardened for it — so the access log is off, and the Worker
# records only what it must (a verdict per site, a verdict per query, never a per-person history).
# Turn this on temporarily when debugging, then turn it off again.
access_log none
cache_store_log none
cache deny all

# Do not advertise the proxy or the client's address onward.
via off
forwarded_for delete
httpd_suppress_version_string on

# --- Resources -----------------------------------------------------------------------------------

# Decrypting is CPU work, not memory work, and this box also runs Headwind. Keep the footprint small
# and let the kernel do the caching.
cache_mem 64 MB
maximum_object_size_in_memory 128 KB
pid_filename /var/run/squid.pid
